<!doctype html>
<html>
<head>
  <meta charset="utf-8">
  <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@600;700;800&display=swap" rel="stylesheet">
  <style>
    body { margin: 0; font-family: 'Poppins', 'Avenir Next', system-ui, sans-serif; }
  </style>
</head>
<body>
<div style="width: 1200px; height: 630px; position: relative; overflow: hidden; background: #2a1866; display: flex; flex-direction: column;">
  <svg width="1200" height="630" viewBox="0 0 1200 630" style="position: absolute; top: 0; left: 0;" aria-hidden="true">
    <path d="M980 630 C 980 480, 1200 500, 1200 360 L 1200 630 Z" fill="#3b228a" opacity="0.55"></path>
    <circle cx="70" cy="70" r="130" fill="#3b228a" opacity="0.35"></circle>
  </svg>
  <div style="position: relative; display: flex; align-items: center; padding: 40px 0 0 56px;">
    <img src="logo-light.svg" alt="Formester" style="width: 240px; height: 34px;">
  </div>
  <div style="position: relative; flex: 1; display: flex; align-items: center; gap: 48px; padding: 0 56px 24px 56px;">
    <div style="flex: 1.1; color: #ffffff; font-size: 62px; font-weight: 800; line-height: 1.16; letter-spacing: -1px;">How to Create an Online Form from a <span style="color: #f4551c;">PDF</span></div>
    <div style="flex: 1; display: flex; justify-content: center;">
      <div style="width: 430px; background: #f7f3ee; border-radius: 18px; padding: 26px; display: flex; align-items: center; gap: 20px; box-shadow: 0 24px 48px rgba(10, 4, 40, 0.45);">
        <div style="width: 128px; height: 168px; background: #ffffff; border-radius: 8px; border: 1px solid #e4ddd2; position: relative; padding: 14px 12px; display: flex; flex-direction: column; gap: 8px;">
          <div style="position: absolute; top: -10px; right: -10px; background: #e5484d; color: #ffffff; font-size: 11px; font-weight: 700; border-radius: 6px; padding: 3px 7px;">PDF</div>
          <div style="height: 8px; width: 70%; background: #d8d2c6; border-radius: 4px;"></div>
          <div style="height: 6px; width: 90%; background: #eae5db; border-radius: 3px;"></div>
          <div style="height: 6px; width: 84%; background: #eae5db; border-radius: 3px;"></div>
          <div style="height: 6px; width: 88%; background: #eae5db; border-radius: 3px;"></div>
          <div style="height: 6px; width: 60%; background: #eae5db; border-radius: 3px;"></div>
        </div>
        <svg width="34" height="24" viewBox="0 0 34 24" aria-hidden="true"><path d="M2 12 L26 12 M19 4 L27 12 L19 20" stroke="#6434d0" stroke-width="3.4" fill="none" stroke-linecap="round" stroke-linejoin="round"></path></svg>
        <div style="width: 168px; background: #ffffff; border-radius: 10px; border: 1px solid #ece6f9; padding: 14px 12px; display: flex; flex-direction: column; gap: 9px;">
          <div style="height: 7px; width: 55%; background: #c9b8ef; border-radius: 4px;"></div>
          <div style="height: 16px; width: 100%; background: #f0ebfa; border: 1px solid #ded2f5; border-radius: 5px;"></div>
          <div style="height: 7px; width: 45%; background: #c9b8ef; border-radius: 4px;"></div>
          <div style="height: 16px; width: 100%; background: #f0ebfa; border: 1px solid #ded2f5; border-radius: 5px;"></div>
          <div style="height: 20px; width: 62%; background: #6434d0; border-radius: 6px; margin-top: 4px;"></div>
        </div>
      </div>
    </div>
  </div>
</div>
</body>
</html>
