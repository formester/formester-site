<!doctype html>
<html>
<head>
  <meta charset="utf-8">
  <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@600;700;800&display=swap" rel="stylesheet">
  <style>
    body { margin: 0; font-family: 'Poppins', 'Avenir Next', system-ui, sans-serif; }
  </style>
</head>
<body>
<div style="width: 1200px; height: 630px; position: relative; overflow: hidden; background: #2a1866; display: flex; flex-direction: column;">
  <svg width="1200" height="630" viewBox="0 0 1200 630" style="position: absolute; top: 0; left: 0;" aria-hidden="true">
    <path d="M980 630 C 980 480, 1200 500, 1200 360 L 1200 630 Z" fill="#3b228a" opacity="0.55"></path>
    <circle cx="70" cy="70" r="130" fill="#3b228a" opacity="0.35"></circle>
  </svg>
  <div style="position: relative; display: flex; align-items: center; padding: 40px 0 0 56px;">
    <img src="logo-light.svg" alt="Formester" style="width: 240px; height: 34px;">
  </div>
  <div style="position: relative; flex: 1; display: flex; align-items: center; gap: 48px; padding: 0 56px 24px 56px;">
    <div style="flex: 1.1; color: #ffffff; font-size: 58px; font-weight: 800; line-height: 1.16; letter-spacing: -1px;">Response <span style="color: #f4551c;">Validation</span> in Google Forms</div>
    <div style="flex: 1; display: flex; justify-content: center;">
      <div style="width: 430px; background: #f7f3ee; border-radius: 18px; padding: 26px; display: flex; justify-content: center; box-shadow: 0 24px 48px rgba(10, 4, 40, 0.45);">
        <div style="width: 330px; background: #ffffff; border-radius: 12px; border: 1px solid #ece6f9; padding: 20px 18px; display: flex; flex-direction: column; gap: 12px;">
          <div style="height: 9px; width: 58%; background: #c9b8ef; border-radius: 4px;"></div>
          <div style="display: flex; flex-direction: column; gap: 7px;">
            <div style="height: 34px; width: 100%; background: #fdf1ef; border: 2px solid #e5484d; border-radius: 7px; display: flex; align-items: center; padding: 0 10px; box-sizing: border-box;">
              <div style="height: 8px; width: 55%; background: #e0c7c2; border-radius: 4px;"></div>
            </div>
            <div style="display: flex; align-items: center; gap: 7px;">
              <svg width="14" height="14" viewBox="0 0 14 14" aria-hidden="true"><circle cx="7" cy="7" r="7" fill="#e5484d"></circle><path d="M7 3.4 L7 7.8 M7 10 L7 10.6" stroke="#ffffff" stroke-width="1.8" stroke-linecap="round"></path></svg>
              <div style="height: 7px; width: 62%; background: #f0b6b3; border-radius: 4px;"></div>
            </div>
          </div>
          <div style="display: flex; flex-direction: column; gap: 7px; margin-top: 2px;">
            <div style="height: 34px; width: 100%; background: #f2fbf4; border: 2px solid #34a853; border-radius: 7px; display: flex; align-items: center; padding: 0 10px; box-sizing: border-box;">
              <div style="height: 8px; width: 48%; background: #bfe3c8; border-radius: 4px;"></div>
            </div>
            <div style="display: flex; align-items: center; gap: 7px;">
              <svg width="14" height="14" viewBox="0 0 14 14" aria-hidden="true"><circle cx="7" cy="7" r="7" fill="#34a853"></circle><path d="M4 7.2 L6.2 9.4 L10 4.9" stroke="#ffffff" stroke-width="1.8" fill="none" stroke-linecap="round" stroke-linejoin="round"></path></svg>
              <div style="height: 7px; width: 40%; background: #bfe3c8; border-radius: 4px;"></div>
            </div>
          </div>
          <div style="height: 26px; width: 46%; background: #6434d0; border-radius: 7px; margin-top: 6px;"></div>
        </div>
      </div>
    </div>
  </div>
</div>
</body>
</html>
