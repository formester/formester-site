<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <title>S3 Uploader</title>
  <style>
    :root { color-scheme: light dark; }
    body { font-family: system-ui, sans-serif; margin: 0; padding: 24px; max-width: 1100px; margin-inline: auto; }
    h1 { font-size: 20px; margin: 0 0 4px; }
    #bucket-info { color: #888; font-size: 13px; margin-bottom: 20px; }
    #dropzone {
      border: 2px dashed #999; border-radius: 12px; padding: 32px; text-align: center;
      color: #888; margin-bottom: 24px; transition: background 0.15s, border-color 0.15s;
    }
    #dropzone.dragover { border-color: #6941c6; background: rgba(105, 65, 198, 0.08); color: #6941c6; }
    #file-input { display: none; }
    #search { width: 100%; padding: 8px 12px; margin-bottom: 16px; border-radius: 8px; border: 1px solid #999; font-size: 14px; box-sizing: border-box; }
    #grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(160px, 1fr)); gap: 14px; }
    .item { border: 1px solid #ddd; border-radius: 10px; overflow: hidden; font-size: 12px; }
    .item .thumb { width: 100%; height: 110px; background: #f2f2f2; display: flex; align-items: center; justify-content: center; overflow: hidden; }
    .item .thumb img { width: 100%; height: 100%; object-fit: cover; }
    .item .thumb .ext { color: #aaa; font-size: 24px; font-weight: 600; }
    .item .meta { padding: 8px; }
    .item .name { font-weight: 600; word-break: break-all; margin-bottom: 4px; }
    .item .size { color: #888; margin-bottom: 8px; }
    .item button { width: 100%; padding: 6px; border-radius: 6px; border: 1px solid #999; background: none; cursor: pointer; font-size: 12px; }
    .item button:hover { background: #6941c6; color: white; border-color: #6941c6; }
    #status { margin-bottom: 16px; font-size: 13px; color: #6941c6; min-height: 18px; }
  </style>
</head>
<body>
  <h1>S3 Uploader</h1>
  <div id="bucket-info">Loading bucket info…</div>

  <div id="dropzone">Drag a file here, or click to choose one</div>
  <input type="file" id="file-input" multiple>

  <div id="status"></div>

  <input type="text" id="search" placeholder="Filter by filename…">
  <div id="grid"></div>

  <script src="app.js"></script>
</body>
</html>
